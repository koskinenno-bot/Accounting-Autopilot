version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-accountant-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main_db
    # Tietokannat ja jonot vain tältä koneelta (oletussalasanat eivät saa näkyä lähiverkkoon)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - ai-accountant-network

  redis:
    image: redis:7-alpine
    container_name: ai-accountant-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-accountant-network

  kafka:
    # Bitnami poisti julkiset docker.io/bitnami-imaget 2025; sama image löytyy bitnamilegacy-nimiavaruudesta.
    image: bitnamilegacy/kafka:3.5
    container_name: ai-accountant-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ai-accountant-network

  minio:
    # minio/minio ei ole enää vedettävissä Docker Hubista; Bitnamin image käynnistää palvelimen
    # itse (API 9000, konsoli 9001) ja tallentaa datan polkuun /bitnami/minio/data.
    image: bitnamilegacy/minio:2025.7.23
    container_name: ai-accountant-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - ai-accountant-network

  kong:
    image: kong:3.4-ubuntu
    container_name: ai-accountant-api-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000" # Proxy
      - "8443:8443" # Proxy SSL
      # Admin-API vain paikallisesti; 8001 oli myös ristiriidassa ml-servicen portin kanssa.
      - "127.0.0.1:8002:8001" # Admin
      - "127.0.0.1:8445:8444" # Admin SSL
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; Windows/Mac Docker Desktop tuntee nimen valmiiksi
    volumes:
      - ./docker/kong/kong.yml:/kong/declarative/kong.yml
    networks:
      - ai-accountant-network
networks:
  ai-accountant-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
